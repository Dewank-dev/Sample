<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="/styles/wedding.css"></head><body>
<main class="preview"><div class="stage"><canvas id="canvas" width="720" height="1280" aria-label="Animated wedding invitation preview"></canvas></div><section class="transport"><div class="buttons"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="restart">↻ Restart</button></div><input id="seek" class="track" type="range" min="0" max="34" step=".1" value="0" aria-label="Invitation timeline"><div class="status"><span id="scene">Opening</span><span id="clock">00:00 / 00:34</span></div><div class="audio-row"><button id="mute">🔊 Audio</button><label>Volume <input id="volume" type="range" min="0" max="1" step=".05" value=".7"></label><span id="audioNote">No music added</span></div><div class="export-row"><button class="export" id="record">Download MP4</button><button class="export" id="webm">Download WebM</button><button class="export" id="html">Download HTML</button></div><p id="hint" class="hint">MP4 records one invitation cycle. Keep this tab open until encoding finishes.</p><audio id="audio" preload="metadata"></audio></section></main>
<script>(()=>{const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:740});let engine=null,hasAudio=false,graph=null,config={},assets={};const c=document.querySelector('#canvas'),a=document.querySelector('#audio'),seek=document.querySelector('#seek'),hint=document.querySelector('#hint');const scripts=['/animation/scenes.js','/animation/particles.js','/animation/decorations.js','/animation/text.js','/animation/transitions.js','/animation/engine.js'];function load(){return Promise.all(scripts.map(src=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})))}function init(args){config=args.config||{};assets=args.assets||{};hasAudio=!!args.audio;if(hasAudio)a.src=args.audio;else a.removeAttribute('src');a.hidden=!hasAudio;document.querySelector('#audioNote').textContent=hasAudio?'Music ready':'No music added';if(!engine)load().then(()=>{engine=new WeddingEngine(c,config,assets);engine.setAudio(a);engine.tick=t=>{let timeline=t*34/engine.duration;seek.value=t;let mm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');document.querySelector('#clock').textContent=mm(t)+' / '+mm(engine.duration);let i=WeddingScenes.at(timeline);document.querySelector('#scene').textContent=`Scene ${i+1} — ${WeddingScenes.list[i].title}`;seek.max=engine.duration}}).catch(()=>{hint.textContent='Animation failed to load. Refresh and try again.';hint.className='hint err'});else engine.setData(config)}window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')init(e.data.args||{})});document.querySelector('#play').onclick=()=>{engine?.play();if(hasAudio)a.play().catch(()=>{})};document.querySelector('#pause').onclick=()=>{engine?.pause();a.pause()};document.querySelector('#restart').onclick=()=>{engine?.restart();if(hasAudio)a.play().catch(()=>{})};seek.oninput=()=>engine?.seek(+seek.value);document.querySelector('#mute').onclick=e=>{a.muted=!a.muted;e.currentTarget.textContent=a.muted?'🔇 Muted':'🔊 Audio'};document.querySelector('#volume').oninput=e=>a.volume=+e.target.value;function busy(b,msg){document.querySelectorAll('.export').forEach(x=>x.disabled=b);hint.textContent=msg;hint.className='hint'+(b?' busy':'')}function save(blob,name){let x=document.createElement('a');x.href=URL.createObjectURL(blob);x.download=name;x.click();setTimeout(()=>URL.revokeObjectURL(x.href),4000)}async function audioTracks(stream){if(!hasAudio)return[];await a.play();if(!graph){let ctx=new AudioContext(),src=ctx.createMediaElementSource(a),dst=ctx.createMediaStreamDestination();src.connect(dst);src.connect(ctx.destination);graph=dst}return graph.stream.getAudioTracks()}async function record(returnToPython){if(!engine||!window.MediaRecorder||!c.captureStream){hint.textContent='Video recording is not supported by this browser.';return}busy(true,'Recording the animated invitation…');engine.pause();engine.seek(0);let stream=c.captureStream(30);try{let tracks=await audioTracks(stream),all=new MediaStream([...stream.getVideoTracks(),...tracks]),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',rec=new MediaRecorder(all,{mimeType:mime,videoBitsPerSecond:2600000}),parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);rec.onstop=()=>{let blob=new Blob(parts,{type:'video/webm'});a.pause();if(!returnToPython){save(blob,'wedding-invitation.webm');busy(false,'WebM downloaded.')}else{let r=new FileReader();r.onload=()=>{send('streamlit:setComponentValue',{value:{type:'wedding-webm',data:r.result.split(',')[1]}});busy(false,'Video sent for MP4 encoding. Download it from the app panel.')};r.readAsDataURL(blob)}};rec.start(250);engine.play();setTimeout(()=>{engine.pause();rec.stop()},engine.duration*1000)}catch(e){engine.pause();a.pause();busy(false,'Recording failed. Try WebM or standalone HTML.') }}document.querySelector('#record').onclick=()=>record(true);document.querySelector('#webm').onclick=()=>record(false);document.querySelector('#html').onclick=()=>send('wedding:download-html');})();</script></body></html>
